  <title>Happy Birthday Waiwai</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: monospace;
    }
    .container {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .image {
      width: 200px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 0 20px hotpink;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(38, 16px);
      grid-template-rows: repeat(26, 16px);
      gap: 3px;
      margin-bottom: 20px;
    }
    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: transparent;
    }
    .on {
      animation: fadeIn 0.5s forwards;
      background-color: hotpink;
    }
    @keyframes fadeIn {
      0% { background-color: transparent; transform: scale(0.2); opacity: 0; }
      100% { background-color: hotpink; transform: scale(1); opacity: 1; }
    }
    .cake {
      white-space: pre;
      font-size: 16px;
      color: pink;
      text-align: center;
      margin-top: 10px;
    }
    .candle {
      color: gold;
      animation: flicker 1s infinite alternate;
    }
    @keyframes flicker {
      from { opacity: 0.2; transform: translateY(-2px); }
      to { opacity: 1; transform: translateY(2px); }
    }
  </style>

<style>
@keyframes floating {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}
.floating-text {
  animation: floating 2.5s ease-in-out infinite;
}
.floating-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: #ff69b4;
  color: white;
  border: none;
  border-radius: 50px;
  padding: 12px 20px;
  font-size: 14px;
  text-decoration: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: background-color 0.3s;
}
.floating-button:hover {
  background-color: #e055a4;
}
</style>

<style>
  .heart {
    width: 20px;
    height: 20px;
    position: fixed;
    background: red;
    transform: rotate(-45deg);
    animation: floatHeart 8s linear infinite;
    opacity: 0.6;
    z-index: 1;
  }
  .heart:before,
  .heart:after {
    content: "";
    width: 20px;
    height: 20px;
    position: absolute;
    background: red;
    border-radius: 50%;
  }
  .heart:before {
    top: -10px;
    left: 0;
  }
  .heart:after {
    left: 10px;
    top: 0;
  }

  @keyframes floatHeart {
    0% {
      transform: translateY(0) rotate(-45deg);
      opacity: 0.6;
    }
    100% {
      transform: translateY(-100vh) rotate(-45deg);
      opacity: 0;
    }
  }
</style>

<script>
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
  }

  setInterval(createHeart, 300);
</script>
