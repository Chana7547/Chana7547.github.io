
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Happy Birthday LED</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      margin: 0;
      padding: 40px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scrolling-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .line {
      display: flex;
      gap: 10px;
    }

    .char {
      display: grid;
      grid-template-columns: repeat(5, 16px);
      grid-template-rows: repeat(7, 16px);
      gap: 2px;
    }

    .dot {
      width: 16px;
      height: 16px;
      background-color: #222;
    }

    .dot.on {
      background-color: hotpink;
      box-shadow: 0 0 5px hotpink;
    }
  
.flame {
  animation: flicker 1s infinite;
  color: gold;
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; transform: translateY(-2px); }
}

.flame {
  animation: flicker 1s infinite;
  color: gold;
}
@keyframes flicker {
  0%, 100% { opacity: 1; transform: translateY(0); }
  50% { opacity: 0.3; transform: translateY(-2px); }
}
</style>
<style>
  .image-row {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 40px;
    gap: 40px;
  }

  .image-frame img {
    width: 160px;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 0 20px hotpink;
  }

  .cake {
    margin-top: 40px;
    white-space: pre;
    color: lightpink;
    font-size: 16px;
    text-align: center;
  }
</style>
<style>
  .led-layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    margin-top: 60px;
    flex-wrap: wrap;
  }

  .led-center {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .image-frame img {
    width: 140px;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 0 20px hotpink;
  }
</style>
<style>
  .cake span {
    display: inline-block;
    animation: flicker 1s infinite;
  }

  .cake span:nth-child(1) { animation-delay: 0s; }
  .cake span:nth-child(2) { animation-delay: 0.1s; }
  .cake span:nth-child(3) { animation-delay: 0.2s; }
  .cake span:nth-child(4) { animation-delay: 0.3s; }
  .cake span:nth-child(5) { animation-delay: 0.4s; }
  .cake span:nth-child(6) { animation-delay: 0.5s; }
  .cake span:nth-child(7) { animation-delay: 0.6s; }

  @keyframes flicker {
    0%, 100% { transform: translateY(0); opacity: 1; }
    50% { transform: translateY(-3px); opacity: 0.6; }
  }
        </style>
<style>
  .heart {
    position: fixed;
    color: hotpink;
    font-size: 20px;
    animation: float 6s linear infinite;
    pointer-events: none;
  }

  @keyframes float {
    0% {
      transform: translateY(0);
      opacity: 1;
    }
    100% {
      transform: translateY(-800px);
      opacity: 0;
    }
  }
</style>
<style>
  .top-note {
    position: fixed;
    top: 10px;
    left: 15px;
    font-size: 12px;
    color: #ffb6c1;
    font-style: italic;
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>

<script>
    const FONT = {
      "A": ["01110","10001","10001","11111","10001","10001","10001"],
      "B": ["11110","10001","10001","11110","10001","10001","11110"],
      "C": ["01111","10000","10000","10000","10000","10000","01111"],
      "D": ["11110","10001","10001","10001","10001","10001","11110"],
      "E": ["11111","10000","10000","11110","10000","10000","11111"],
      "H": ["10001","10001","10001","11111","10001","10001","10001"],
      "I": ["01110","00100","00100","00100","00100","00100","01110"],
      "P": ["11110","10001","10001","11110","10000","10000","10000"],
      "R": ["11110","10001","10001","11110","10100","10010","10001"],
      "T": ["11111","00100","00100","00100","00100","00100","00100"],
      "W": ["10001","10001","10001","10101","10101","10101","01010"],
      "Y": ["10001","10001","01010","00100","00100","00100","00100"],
      " ": ["00000","00000","00000","00000","00000","00000","00000"],
      "<": ["00010","00100","01000","00100","00010","00000","00000"],
      "3": ["11110","00010","00100","00010","00010","10010","01100"]
    };

    const lines = ["HAPPY", "BIRTHDAY", "WAIWAI", "<333"];
    const container = document.getElementById("scrolling-text");

    function createChar(char) {
      const grid = document.createElement("div");
      grid.className = "char";

      const pixels = FONT[char.toUpperCase()] || FONT[" "];
      pixels.forEach(row => {
        [...row].forEach(bit => {
          const dot = document.createElement("div");
          dot.className = "dot";
          if (bit === "1") dot.classList.add("on");
          grid.appendChild(dot);
        });
      });

      return grid;
    }

    async function showLine(text) {
      const lineDiv = document.createElement("div");
      lineDiv.className = "line";
      container.appendChild(lineDiv);

      for (let i = 0; i < text.length; i++) {
        const charEl = createChar(text[i]);
        lineDiv.appendChild(charEl);
        await new Promise(res => setTimeout(res, 150));
      }
    }

    async function showAll() {
      for (const line of lines) {
        await showLine(line);
        await new Promise(res => setTimeout(res, 700));
      }
    }

    window.onload = showAll;
  </script>
